<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>yeslyf wireframes v0.2</title>
<style>
  :root{
    --paper:#EEF0F3; --panel:#FFFFFF; --ink:#1B1F27; --mute:#5F6773; --line:#D3D7DE;
    --wire:#E6E8EC; --wire2:#B8BEC7; --accent:#FFDA00; --accent-soft:#FFF4B8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
  a{color:inherit}
  button,select,textarea{font-family:inherit;font-size:13px}
  button{cursor:pointer}
  ::selection{background:var(--accent)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .brand span{font-weight:400;color:var(--mute);margin-left:8px;font-size:13px}
  .tabs{display:flex;gap:2px;flex-wrap:wrap}
  .tabs a{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid transparent;color:var(--mute)}
  .tabs a:hover{background:#F5F6F8}
  .tabs a.on{color:var(--ink);font-weight:600;border-color:var(--line);background:#fff}
  .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-left:auto}
  .who select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:170px}
  .saved{font-size:12px;color:var(--mute);min-width:120px}
  .pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute);text-decoration:none;white-space:nowrap}
  .pill.on{border-color:#C9A800;background:var(--accent-soft);color:var(--ink)}
  .top .primary{border:1px solid var(--accent);background:var(--accent);padding:7px 12px;border-radius:6px;font-weight:600}

  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:6px 18px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
  .bar label{display:flex;gap:5px;align-items:center;white-space:nowrap}
  .bar select{padding:5px;border:1px solid var(--line);border-radius:5px;background:#fff;max-width:230px}
  .bar .off{display:none}
  .tiers{display:flex;gap:4px}
  .tiers button,.actions button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px}
  .tiers button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions{display:flex;gap:6px;margin-left:auto}
  .banner{padding:6px 18px;background:var(--accent-soft);border-bottom:1px solid #C9A800;font-size:12.5px}

  .layout{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;height:calc(100vh - 128px)}
  .nav{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 0 40px}
  .nav-sec{margin-bottom:6px}
  .nav-sec-t{padding:10px 16px 4px;font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between}
  .nav-sec-t em{font-style:normal;font-weight:400}
  .nav-item{display:flex;gap:10px;align-items:baseline;padding:6px 16px 6px 13px;text-decoration:none;border-left:3px solid transparent;font-size:13px;position:relative}
  .nav-item:hover{background:#F5F6F8}
  .nav-item.on{border-left-color:var(--accent);background:var(--accent-soft)}
  .nav-item.dim{opacity:.4}
  .nav-id{font-variant-numeric:tabular-nums;color:var(--mute);width:38px;flex:none;font-size:12px}
  .dot{position:absolute;right:12px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1px solid #C9A800}
  .mk{font-style:normal;font-size:10px;border:1px solid #C9A800;border-radius:4px;padding:0 4px;margin-left:6px;color:#7A6000;vertical-align:middle}
  .mk.new{border-color:var(--ink);color:var(--ink)}

  .main{overflow:auto;padding:14px 20px 40px}
  .mobile-jump{display:none;margin-bottom:10px}
  .mobile-jump select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff}
  .ribbon{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .rib{font-size:12px;color:var(--mute);text-decoration:none;padding:4px 8px;border-radius:4px;border-bottom:2px solid transparent}
  .rib.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  .crumb-row{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin:4px 2px 12px;gap:12px;flex-wrap:wrap}
  .strip{font-size:12px;padding:6px 10px;border:1px solid #C9A800;background:#FFFBEA;border-radius:6px;margin:0 0 10px}
  .strip.off{display:none}
  .stage{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"prev frame next";gap:10px;align-items:start;justify-items:center}
  #prev{grid-area:prev} #next{grid-area:next} #frame{grid-area:frame}
  .arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);position:sticky;top:45%;font-size:18px}
  .arrow:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  .frame{background:var(--panel);border:2px solid var(--ink);box-shadow:0 12px 30px rgba(27,31,39,.12)}
  .frame.phone{width:372px;min-height:700px;border-radius:30px;overflow:hidden}
  .frame.desktop{width:100%;max-width:900px;min-height:520px;border-radius:10px}
  .frame-top{display:flex;justify-content:space-between;gap:8px;padding:10px 18px;font-size:11px;color:var(--mute);border-bottom:1px dashed var(--line)}
  .frame-top span:first-child{font-weight:700;color:var(--ink)}
  .frame-body{padding:16px 18px 24px}
  .w-hidden{background:#FFF1F1;border:1px solid #E7B4B4;color:#8A2E2E;padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:10px}

  /* wireframe grammar */
  .w-h{font-size:18px;font-weight:700;line-height:1.3;margin:6px 0 12px}
  .w-p{font-size:13px;color:#3B4250;margin:0 0 12px}
  .w-note{font-size:11.5px;color:var(--mute);margin:0 0 10px;padding:6px 8px;border-left:3px solid var(--line)}
  .who input{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;width:180px;background:#fff}
  .views a{cursor:pointer}
  .doc{padding:18px 24px;max-width:1200px;margin:0 auto;font-size:13px;line-height:1.5}
  .doc h1{font-size:20px;margin:0 0 8px}.doc h2{font-size:16px;margin:22px 0 8px}.doc h2 small{font-weight:400;color:var(--mute);margin-left:8px;font-size:12px}.doc h3{font-size:14px;margin:16px 0 6px}
  .doc .lead{color:var(--mute)}.doc .meta{color:var(--mute);font-size:12px}.doc .rule{background:var(--accent-soft);padding:6px 10px;border-radius:6px}
  .doc .wrap{overflow-x:auto;margin:8px 0}.doc table{border-collapse:collapse;width:100%;font-size:12px}.doc th,.doc td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.doc th{background:#F3F1EA}
  .doc .stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.doc .stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px}.doc .stat b{font-size:18px;display:block}
  .doc .tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}.doc .docnav{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:12px}
  .doc .sid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.doc ul{padding-left:18px}
  .w-strip{font-size:10.5px;color:var(--mute);padding:2px 0 5px;margin:0 0 8px;border-bottom:1px dashed var(--line);letter-spacing:.2px}
  .w-in{border:1px solid var(--wire2);border-radius:6px;padding:11px 10px;margin:0 0 10px;color:var(--mute);font-size:13px;background:#FAFBFC}
  .w-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .w-chip{border:1px solid var(--wire2);border-radius:999px;padding:6px 11px;font-size:12px;background:#fff}
  .w-radio{margin:0 0 12px}
  .w-opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px;background:#fff}
  .w-opt i{flex:none;width:14px;height:14px;border:2px solid var(--wire2);border-radius:50%;margin-top:2px}
  .w-btn{display:block;width:100%;border:0;background:var(--ink);color:#fff;padding:13px;border-radius:8px;font-weight:600;font-size:14px;margin:6px 0 10px;text-align:center}
  .w-btn2{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .w-link{display:block;text-align:center;font-size:13px;text-decoration:underline;color:var(--mute);margin:2px 0 12px;cursor:pointer}
  .w-card{border:1px solid var(--wire2);border-radius:8px;padding:10px 12px;margin:0 0 10px;background:#FAFBFC}
  .w-card-t{font-weight:600;font-size:13px;margin-bottom:5px}
  .w-card ul{margin:0;padding-left:16px;font-size:12.5px;color:#3B4250}
  .w-card li{margin:2px 0}
  .w-rows{margin:0 0 12px;border-top:1px solid var(--line)}
  .w-row{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
  .w-row b{font-weight:600;text-align:right}
  .w-chart,.w-video{position:relative;min-height:120px;border:1px solid var(--wire2);border-radius:8px;margin:0 0 12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:12px;color:var(--mute);
    background:repeating-linear-gradient(135deg,#F3F4F6 0 8px,#E9EBEF 8px 16px)}
  .w-video i{position:absolute;left:12px;top:12px;width:0;height:0;border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
  .w-num{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 10px}
  .w-tabs{display:flex;gap:2px;overflow-x:auto;margin:0 0 12px;border-bottom:1px solid var(--line)}
  .w-tabs span{flex:none;padding:6px 10px;font-size:12px;color:var(--mute);border-bottom:2px solid transparent}
  .w-tabs span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .w-badge{display:inline-block;font-size:10px;border:1px solid var(--wire2);border-radius:4px;padding:1px 5px;color:var(--mute)}
  .w-prog{margin:0 0 12px;font-size:12px;color:var(--mute)}
  .w-prog div{height:8px;background:var(--wire);border-radius:4px;margin-top:6px;overflow:hidden}
  .w-prog i{display:block;height:100%;background:var(--ink)}
  .w-table{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 14px}
  .w-table th{text-align:left;font-weight:600;border-bottom:2px solid var(--ink);padding:6px 6px;vertical-align:bottom}
  .w-table td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:top;color:#3B4250}
  .frame.desktop .w-h{font-size:20px}

  .side{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 18px 60px}
  .review{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px;background:#FCFCFD}
  .review-t{font-weight:700;font-size:13px;margin-bottom:8px}
  .review select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:8px}
  .reason-wrap.off{display:none}
  .verdict{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .verdict button{flex:1;border:1px solid var(--line);background:#fff;padding:7px;border-radius:6px}
  .verdict button.on{background:var(--accent);border-color:#C9A800;font-weight:700}
  #comment{width:100%;min-height:120px;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;font-size:13px;resize:vertical;background:#fff}
  .review .saved{font-size:11px;color:var(--mute);min-height:14px;margin-top:4px}
  .marker{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:12px;background:#FCFCFD;color:#3B4250}
  .marker.changed{border-color:#C9A800;background:#FFFBEA}
  .marker.new{border-color:var(--ink);background:#fff}
  .marker b{display:block;margin-bottom:3px;color:var(--ink)}
  .chk{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:12px;background:#fff}
  .chk b{display:block;margin-bottom:4px}
  .chk ul{margin:0;padding-left:16px;color:#3B4250}
  .spec-purpose{font-size:14px;line-height:1.5;margin:0 0 14px;padding-left:10px;border-left:3px solid var(--accent)}
  .spec-block{margin:0 0 12px}
  .spec-t{font-size:12px;font-weight:700;margin-bottom:4px}
  .spec-block ul{margin:0;padding-left:16px;font-size:12.5px;color:#3B4250}
  .spec-block li{margin:3px 0}
  .side .tiers{margin:0;display:block;font-size:12.5px}
  .br{display:inline-block;font-size:11px;font-weight:600;text-decoration:none;border:1px solid var(--line);padding:0 5px;border-radius:4px;margin-left:4px}

  .map{display:none;padding:16px 24px 60px;max-width:1300px;margin:0 auto}
  body.map-on .layout{display:none}
  body.map-on .map{display:block}
  .map-sec h3{font-size:13px;margin:16px 0 6px;color:var(--mute)}
  .map-row{display:flex;flex-wrap:wrap;gap:6px}
  .map-chip{text-decoration:none;font-size:12px;border:1px solid var(--line);background:#fff;padding:5px 9px;border-radius:6px}
  .map-chip b{margin-right:6px;color:var(--mute);font-weight:600}
  .map-chip.dim{opacity:.4}

  @media (max-width:1000px){
    .layout{display:block;height:auto}
    .nav{display:none}
    .mobile-jump{display:block}
    .stage{grid-template-columns:1fr 1fr;grid-template-areas:"frame frame" "prev next";justify-items:stretch}
    .arrow{position:static;width:100%;height:44px;border-radius:8px;margin-top:6px}
    .frame.phone{width:100%;max-width:420px;margin:0 auto}
    .side{border-left:0;border-top:1px solid var(--line)}
    .top{flex-wrap:wrap;gap:8px}
    .who{margin-left:0}
    .actions{margin-left:0}
    .ribbon{display:none}
  }
.histwrap{margin-top:6px}
.hist-toggle{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 8px;color:var(--mute);cursor:pointer}
.histbox{margin-top:6px}
.hist{list-style:none;margin:0;padding:0;font-size:12px;color:var(--ink)}
.hist li{padding:3px 0;border-top:1px solid var(--line)}
.hist .t{color:var(--mute);margin-right:6px}
.hist-empty{font-size:12px;color:var(--mute)}
</style>
<script src="config.js"></script>
</head>

<script>var SECTIONS=[["X", "Read me first"], ["A", "Entry and identity"], ["R", "Quick reveal (pre-paywall)"], ["P", "Paywall and checkout"], ["O", "Onboarding hub"], ["D", "Data collection"], ["G", "Outputs: plan and investment plan"], ["K", "Adviser calls"], ["E", "Execution"], ["H", "Living dashboard"], ["Q", "Lifecycle and reviews"], ["N", "Returning-user states"], ["M", "Admin (bought tools)"], ["L", "Logic panel (built by devs)"]];
var SCREENS=[{"id": "X00", "sec": "X", "title": "How to read this file", "tier": ["ALL"], "frame": "desktop", "purpose": "Clickable low-fidelity wireframes for the yeslyf app, v0.2. Grey boxes show what is on a screen and in what order. Nothing here is visual design; that is the studio's job once the flow is agreed.", "ui": [["h", "yeslyf journey wireframes v0.2"], ["p", "Left: the journey, section by section. Middle: the screen. Right: what the screen does, its fields with gate, source and precision, its logic, branches, states, dev notes, events and compliance flag, plus your verdict and comments."], ["p", "Tap any button inside a screen to follow the flow. Use the arrows or your keyboard to step through. Filters at the top: tier (DIY, DIWM, DIFM), path (aa, manual, both), state (pick a returning-user state to see its landing and its home variant), compliance (flagged screens only, by reason), template (one layout at a time, for the studio's count)."], ["p", "Every touched screen carries a marker, Changed in v0.2 or New in v0.2, with its cause: a brief item, a review row, or the post-meeting decision date. Dropped screens are listed on the Changelog tab and never drawn."], ["p", "Comments save in this browser as you type and write to the v02_comments sheet tab when the endpoint is set. Pick your name, or Spinach or Compliance, before commenting. Export downloads a markdown build brief."], ["card", "Tier legend", ["DIY: app only, calls a la carte", "DIWM: same app plus included adviser calls", "DIFM: existing House of Alpha clients; app for data and dashboard, advice off-app", "ALL: shown to everyone"]], ["card", "Decisions baked into v0.2", ["Two SKUs, DIY and DIWM, each billed monthly or quarterly; no one-time card, no credit rule, no one-time state", "Calls: included calls per SKU per period are config, never a drawn number or length; a call is a call, with a topic; any adviser from the call centre takes any call; a la carte calls for anyone on any SKU; bookable at any time, before or after the plan", "No named adviser on any screen; a config flag, adviser continuity (off by default), lets the same adviser be offered again", "DIFM: not a shown SKU, no in-app upsell; DIFM clients exist in the app for tracking only; prospects are flagged in the CRM and called by the call centre", "Holdings that are not AA-fed or CAS-verified: G11 renders, G12 is a locked card with two unlock actions, G13 gives buy advice for new money only", "Brand: yeslyf, lowercase, everywhere"]], ["card", "Why the data spine was rebuilt", ["v0.1 bug, flagged by the studio: the manual branch (A05 Do it manually instead, to D02) never asked a manual user for bank balances, deposits, mutual funds or stocks, and skipped D01; A09's CAS button linked to itself and no upload screen existed", "About 60 percent of the fields the plan needs are manual for every user, AA or not. The manual path is the main road; AA prefills one lane and, more importantly, keeps the plan current afterwards"]], ["card", "Standing rules for every D screen", ["1. One spine, both paths: AA users arrive prefilled and tagged AA-fed, CAS users with holdings tagged CAS-verified, manual users with empty fields; no screen is bypassed on any path; order D01, D08, D09, D05, D06, D02, D03, D04, D07, D10", "2. One question per screen for numbers; taps may auto-advance; list items get a list screen plus a detail screen per item type; every instance is its own screen ID with a template tag", "3. Band rule: every band question shows a visible exact input; a tapped band prefills the exact field with the midpoint; exact removes the approx tag; fixed bands per field from the M2 tables 9.1 to 9.5 where a table exists, else Rs ___ placeholder chips; dynamic bands are shelved until the data flywheel exists; each field is exact-first or band-first", "4. Readback and units: every amount shows a readback in words, a per-month or per-year toggle where either applies, L and Cr multipliers and the numeric keypad; plausibility checks against the reveal prompt a check, never a block", "5. Hesitation detection: at 45 seconds a warm line (D11a), at 90 seconds the why-this-matters sheet (D11b), which reuses the Why this one matters slot every number and detail screen carries as a collapsed link from the start, at 120 seconds or on a second return the skip offer (D11c); copy slots only", "6. Tri-state fields: value, explicit none, not sure; None chips set explicit none; Not sure yet, skip sets not sure; not sure is never stored as zero; blindspot and concern copy fires on explicit none only; not sure produces a verify action", "7. Gate and sharpen: the plan builds when every field the React reads is a value (exact or band) or explicit none; a not-sure field blocks the build and is asked for as a quick range on D13, never filled from an assumption; sharpen fields appear inside the plan section they improve as Sharpen this links that reopen the single screen and re-run", "8. Capture ladder: under the exact input and the bands, the lower-friction sources for that item, in order where they apply: AA, CAS upload, guided lookup, document to the Vault, then Not sure yet, skip; no partner ask anywhere", "9. Source and precision tags on every field: source aa, cas or manual, plus default accepted for the one default the user takes on screen (D07b work-optional age 60); precision exact, approx or unknown; D10 and every G screen show them; a manual override locks the field against AA refresh", "10. Section relief: after the last screen of each spine section, a relief card (D12a to D12h): section done, N of eight, the next section with its minutes, and two chips, Keep going or Remind me later; the adviser-voice line on the card is a copy slot, chosen by the answers, no numbers", "11. Endowed progress: the ring starts at 20 percent after the reveal, weighted gate fields first; minutes are about N minutes", "12. Exit from any D screen: silent autosave with a Saved toast; no sheet. O03 is the <script>// yeslyf board store: the shared save layer of every page (phase 11, Vatsal, 16 Sep 2026).
// Every comment, verdict and field edit on every page is one row in the Supabase table board_entries
// (page, item_id, field, value, who, kind, created_at); rows are never updated or deleted. docs/config.js, loaded
// in the head before this script, sets SUPABASE_URL and SUPABASE_ANON_KEY; both blank keeps the page local only.
// Each page keeps its own localStorage store as before (that is the offline cache). This layer adds one key,
// "yeslyf_entries_v1", holding per page the rows last fetched, the outbox (inserts that failed) and the last write.
// On load it sends the outbox, fetches the page's rows (1000 at a time), hands the latest value per item and
// field to the page (the apply callback; a queued local edit for the same field wins), and writes
// "live, last write <time>" or "offline, saved locally" into the top bar pill. The history toggle under a comment
// box lists every row of that item, newest first, queued rows on top.
// Requests carry the key in the apikey header only (the publishable key is not a JWT and is refused in
// Authorization; the legacy anon key works the same way in apikey alone).
(function(){
  var CACHE_KEY = "yeslyf_entries_v1", PAGE_SIZE = 1000;
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FIELDS = "id,item_id,field,value,who,kind,created_at";
  function cfg(name){ try { var v = window[name]; return typeof v === "string" ? v.trim() : ""; } catch(e){ return ""; } }
  var url = cfg("SUPABASE_URL"); while(url.length && url.charAt(url.length - 1) === "/") url = url.slice(0, -1);
  var key = cfg("SUPABASE_ANON_KEY");
  var configured = !!(url && key);
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}") || {}; } catch(e){ cache = {}; }
  function saveCache(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch(e){} }
  var page = "", applyFn = null, live = false, checked = false, lastWrite = "", boxes = [];
  function pc(){ if(!cache[page]) cache[page] = {}; var c = cache[page]; if(!c.rows) c.rows = []; if(!c.outbox) c.outbox = []; if(!c.last_write) c.last_write = ""; return c; }
  function esc(s){ return String(s === undefined || s === null ? "" : s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;"); }
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function fmt(ts){
    // created_at arrives as UTC from the database and as toISOString() from the outbox; the first 19 characters are
    // the same shape in both, so the display never depends on how a browser parses fractional seconds or offsets.
    var d = new Date(String(ts || "").slice(0, 19) + "Z");
    if(isNaN(d.getTime())) return String(ts || "");
    return d.getDate() + " " + MONTHS[d.getMonth()] + " " + two(d.getHours()) + ":" + two(d.getMinutes());
  }
  function pill(){
    var p = document.getElementById("sheetpill"); if(!p) return;
    var text, title, on = false;
    if(!configured){ text = "offline, saved locally"; title = "docs/config.js has no Supabase URL and key: edits stay in this browser"; }
    else if(!checked){ text = "connecting"; title = "reading board_entries"; }
    else if(live){ text = "live" + (lastWrite ? ", last write " + fmt(lastWrite) : ""); title = "every edit is a row in board_entries; the time is the last write on this page by anyone"; on = true; }
    else { text = "offline, saved locally"; title = "the last request to Supabase failed: edits stay in this browser and are sent on the next load"; }
    p.textContent = text; p.title = title; p.className = "pill" + (on ? " on" : "");
  }
  function strip(r){ return {page: r.page, item_id: r.item_id, field: r.field, value: r.value, who: r.who, kind: r.kind}; }
  function request(method, query, body, cb){
    // cb(status, json) exactly once; status is "ok", "rejected" (the server answered with an error) or "net".
    var done = false;
    function finish(s, j){ if(done) return; done = true; try { cb(s, j); } catch(e){} }
    var headers = {"apikey": key};
    if(body !== undefined){ headers["Content-Type"] = "application/json"; headers["Prefer"] = "return=representation"; }
    var p;
    try { p = fetch(url + "/rest/v1/board_entries" + query, {method: method, headers: headers, body: body === undefined ? undefined : JSON.stringify(body)}); }
    catch(e){ finish("net"); return; }
    Promise.resolve(p).then(function(res){
      if(!res || typeof res.ok !== "boolean") throw new Error("no response");
      if(!res.ok){ finish("rejected", res.status); return; }
      return res.json().then(function(j){ finish("ok", j); });
    }).catch(function(){ finish("net"); });
  }
  function remember(j){
    var r = (j && typeof j.length === "number" && j.length) ? j[0] : null; if(!r || !r.created_at) return;
    var c = pc(); c.rows.push(r); c.last_write = r.created_at; lastWrite = c.last_write;
  }
  function flush(cb){
    // Send every queued row in order; a row that fails stays queued; the caller learns whether all went through.
    var c = pc(); var queue = c.outbox.slice(); var i = 0; var failed = 0;
    (function next(){
      if(i >= queue.length){ saveCache(); cb(failed === 0); return; }
      var row = queue[i++];
      request("POST", "", strip(row), function(s, j){
        if(s === "ok"){ var at = c.outbox.indexOf(row); if(at >= 0) c.outbox.splice(at, 1); remember(j); } else failed++;
        next();
      });
    })();
  }
  function fetchAll(offset, acc, cb){
    request("GET", "?select=" + FIELDS + "&page=eq." + encodeURIComponent(page) + "&order=id.asc&limit=" + PAGE_SIZE + "&offset=" + offset, undefined, function(s, rows){
      if(s !== "ok" || !rows || typeof rows.length !== "number"){ cb(false); return; }
      acc = acc.concat(rows);
      if(rows.length < PAGE_SIZE) cb(true, acc); else fetchAll(offset + PAGE_SIZE, acc, cb);
    });
  }
  function load(){
    pill();
    if(!configured || !page) return;
    flush(function(sent){
      fetchAll(0, [], function(ok, rows){
        checked = true; var c = pc();
        if(ok){
          c.rows = rows; c.last_write = rows.length ? rows[rows.length - 1].created_at : ""; lastWrite = c.last_write; saveCache();
          if(applyFn){
            var latest = {}; rows.forEach(function(r){ latest[r.item_id + "|" + r.field] = r; });
            var pending = {}; c.outbox.forEach(function(r){ pending[r.item_id + "|" + r.field] = 1; });
            var out = []; for(var k in latest) if(!pending[k]) out.push(latest[k]);
            try { applyFn(out); } catch(e){}
          }
        }
        live = ok && sent && !c.outbox.length; pill(); refreshHistory();
      });
    });
  }
  function write(row){
    // row: {item_id, field, value, who, kind}. Queued first, removed on success, so a tab closed mid-request
    // sends the row on the next load (a duplicate row is harmless: same latest value).
    if(!page) return;
    var r = {page: page, item_id: String(row.item_id), field: String(row.field),
             value: String(row.value === undefined || row.value === null ? "" : row.value),
             who: String(row.who || ""), kind: String(row.kind || "field_edit"), created_at: new Date().toISOString(), queued: true};
    if(!configured){ pill(); return; }
    var c = pc(); c.outbox.push(r); saveCache();
    request("POST", "", strip(r), function(s, j){
      var at = c.outbox.indexOf(r);
      if(s === "ok"){ if(at >= 0) c.outbox.splice(at, 1); remember(j); live = true; } else live = false;
      checked = true; saveCache(); pill(); refreshHistory();
    });
  }
  function history(item_id){
    var c = pc(); item_id = String(item_id);
    var queued = c.outbox.filter(function(r){ return r.item_id === item_id; }).slice().reverse();
    var rows = c.rows.filter(function(r){ return r.item_id === item_id; }).slice().reverse();
    return queued.concat(rows);
  }
  function historyHtml(item_id){
    if(!configured) return '<div class="hist-empty">local only: docs/config.js has no Supabase URL and key</div>';
    var rows = history(item_id);
    if(!rows.length) return '<div class="hist-empty">' + (checked ? "no rows yet for " + esc(item_id) : "not loaded yet") + '</div>';
    return '<ul class="hist">' + rows.map(function(r){
      return '<li><span class="t">' + esc(fmt(r.created_at)) + '</span> <b>' + esc(r.who || "-") + '</b> ' + esc(r.field) + ': ' +
             (r.value ? esc(r.value) : '<i>cleared</i>') + (r.queued ? ' <i>queued, not sent yet</i>' : '') + '</li>';
    }).join("") + '</ul>';
  }
  function refreshHistory(){ boxes.forEach(function(b){ if(!b.box.hidden) b.box.innerHTML = historyHtml(b.id()); }); }
  function attach(el, idFn){
    // Adds a "History" toggle right after a control; idFn is the item id or a function returning it.
    if(!el || !el.parentNode) return;
    var id = typeof idFn === "function" ? idFn : function(){ return idFn; };
    var wrap = document.createElement("div"); wrap.className = "histwrap"; wrap.style.gridColumn = "1 / -1";  // a full row inside a grid form
    var b = document.createElement("button"); b.type = "button"; b.className = "hist-toggle"; b.textContent = "History";
    var box = document.createElement("div"); box.className = "histbox"; box.hidden = true;
    b.addEventListener("click", function(){ box.hidden = !box.hidden; if(!box.hidden) box.innerHTML = historyHtml(id()); });
    wrap.appendChild(b); wrap.appendChild(box);
    el.parentNode.insertBefore(wrap, el.nextSibling);
    boxes.push({box: box, id: id});
  }
  function init(opts){ opts = opts || {}; page = String(opts.page || ""); applyFn = opts.apply || null; load(); }
  function status(){ return {configured: configured, live: live, checked: checked, last_write: lastWrite, queued: page ? pc().outbox.length : 0}; }
  function label(){ return configured && live ? "live (board_entries)" : "offline; this file is the record"; }
  window.yeslyfBoard = {init: init, write: write, history: history, attach: attach, refreshHistory: refreshHistory, status: status, label: label};
})();
</script><script>// yeslyf wireframes v0.2 - renderer. Extends the v0.1 renderer (same element grammar, same layout).

  var states = (typeof STATES !== "undefined" && STATES) ? STATES : [];
  var stateById = {}; states.forEach(function(st){ stateById[st.id]=st; });

  var reasons = (typeof REASONS !== "undefined" && REASONS) ? REASONS : {};
  var reasonNames = Object.keys(reasons);
  var templates = []; SCREENS.forEach(function(s){ if(templates.indexOf(s.template)<0) templates.push(s.template); }); templates.sort();

  // ---------- persistence (best effort) ----------
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ store = {}; }
  if(!store.notes) store.notes = {};
  if(!store.who) store.who = "";
  if(LOCK) store.who = LOCK;
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
  function noteFor(id){ if(!store.notes[id]) store.notes[id] = {verdict:"", text:"", reason:"", who:""}; return store.notes[id]; }
  var BOARD = (typeof yeslyfBoard !== "undefined") ? yeslyfBoard : null;
  function put(id, field, value, kind){ if(BOARD) BOARD.write({item_id:id, field:field, value:value, who:store.who || "", kind:kind}); }
  function wb(){ return BOARD ? BOARD.label() : "offline; this file is the record"; }
  function applyRemote(rows){
    // the latest row per screen and field from board_entries; the same shape the controls write
    rows.forEach(function(r){ if(byId[r.item_id] === undefined) return; var n = noteFor(r.item_id); var v = r.value || "";
      if(r.field === "verdict") n.verdict = VERDICTS.indexOf(v) >= 0 ? v : ""; else if(r.field === "reason") n.reason = v; else if(r.field === "text") n.text = v; else return;
      n.who = r.who || n.who; });
    save(); renderSpec(); renderNav();
  }

  function esc(s){ return String(s === undefined || s === null ? "" : s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split('"').join("&quot;"); }
  function flash(t){ var el = document.getElementById("saved"); if(el) el.textContent = t || ""; }

  // ---------- scope ----------
  function tierOk(s){ return state.tier === "ALL" || s.tier.indexOf("ALL") >= 0 || s.tier.indexOf(state.tier) >= 0; }
  function pathOk(s){ return state.path === "both" || s.path === "both" || s.path === state.path; }
  function compOk(s){
    if(state.comp === "all") return true;
    var c = s.compliance || {};
    if(state.comp === "flagged") return !!c.review;
    return !!(c.reasons && c.reasons.indexOf(state.comp) >= 0);
  }
  function tplOk(s){ return state.tpl === "all" || s.template === state.tpl; }
  function inScope(s){ return pathOk(s) && compOk(s) && tplOk(s); }
  function scope(){ return SCREENS.filter(inScope); }
  function walkList(){ var out = []; SCREENS.forEach(function(s,i){ if(inScope(s) && tierOk(s)) out.push(i); }); return out; }
  function ensureScope(i){
    if(inScope(SCREENS[i])) return;
    state.path = "both"; state.comp = "all"; state.tpl = "all"; syncFilters();
  }

  // ---------- wireframe element renderer (v0.1 grammar) ----------
  function el(e){
    var t = e[0];
    switch(t){
      case "h": return '<div class="w-h">'+esc(e[1])+'</div>';
      case "p": return '<div class="w-p">'+esc(e[1])+'</div>';
      case "note": return '<div class="w-note">'+esc(e[1])+'</div>';
      case "strip": return '<div class="w-strip">'+esc(e[1])+'</div>';
      case "in": return '<div class="w-in"><span>'+esc(e[1])+'</span></div>';
      case "chips": return '<div class="w-chips">'+e[1].map(function(c){return '<span class="w-chip">'+esc(c)+'</span>';}).join("")+'</div>';
      case "radio": return '<div class="w-radio">'+e[1].map(function(c){return '<div class="w-opt"><i></i><span>'+esc(c)+'</span></div>';}).join("")+'</div>';
      case "btn": return '<button class="w-btn" data-go="'+esc(e[2]||"")+'">'+esc(e[1])+'</button>';
      case "btn2": return '<button class="w-btn w-btn2" data-go="'+esc(e[2]||"")+'">'+esc(e[1])+'</button>';
      case "link": return '<a class="w-link" data-go="'+esc(e[2]||"")+'">'+esc(e[1])+'</a>';
      case "card": return '<div class="w-card"><div class="w-card-t">'+esc(e[1])+'</div><ul>'+(e[2]||[]).map(function(r){return '<li>'+esc(r)+'</li>';}).join("")+'</ul></div>';
      case "rows": return '<div class="w-rows">'+e[1].map(function(r){return '<div class="w-row"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join("")+'</div>';
      case "chart": return '<div class="w-chart"><span>'+esc(e[1])+'</span></div>';
      case "video": return '<div class="w-video"><i></i><span>'+esc(e[1])+'</span></div>';
      case "num": return '<div class="w-num">'+esc(e[1])+'</div>';
      case "tabs": return '<div class="w-tabs">'+e[1].map(function(c,i){return '<span'+(i===0?' class="on"':'')+'>'+esc(c)+'</span>';}).join("")+'</div>';
      case "badge": return '<span class="w-badge">'+esc(e[1])+'</span>';
      case "progress": return '<div class="w-prog"><span>'+esc(e[1])+'</span><div><i style="width:'+(e[2]||50)+'%"></i></div></div>';
      case "table": return '<table class="w-table"><thead><tr>'+e[1].map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr></thead><tbody>'+e[2].map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table>';
      default: return '';
    }
  }

  // ---------- render ----------
  function renderNav(){
    var html = '';
    SECTIONS.forEach(function(sec){
      var items = scope().filter(function(s){ return s.sec === sec[0]; });
      if(!items.length) return;
      html += '<div class="nav-sec"><div class="nav-sec-t">'+esc(sec[1])+'<em>'+items.length+'</em></div>';
      items.forEach(function(s){
        var i = byId[s.id]; var n = store.notes[s.id];
        var cls = (i === state.idx ? ' on' : '') + (tierOk(s) ? '' : ' dim');
        var dot = n && (n.text || n.verdict) ? '<i class="dot"></i>' : '';
        var mark = s.v02 && s.v02.status === "new" ? '<i class="mk new">new</i>' : (s.v02 && (s.v02.status === "changed" || s.v02.status === "rebuilt") ? '<i class="mk">changed</i>' : '');
        html += '<a class="nav-item'+cls+'" href="#'+s.id+'"><span class="nav-id">'+s.id+'</span><span>'+esc(s.title)+mark+'</span>'+dot+'</a>';
      });
      html += '</div>';
    });
    document.getElementById("nav").innerHTML = html;
    var on = document.querySelector(".nav-item.on"); if(on && on.scrollIntoView){ try { on.scrollIntoView({block:"nearest"}); } catch(e){} }
  }

  function renderRibbon(){
    var s = SCREENS[state.idx];
    document.getElementById("ribbon").innerHTML = SECTIONS.map(function(sec){
      var first = scope().filter(function(x){ return x.sec === sec[0]; })[0];
      if(!first) return '';
      return '<a href="#'+first.id+'" class="rib'+(sec[0] === s.sec ? ' on' : '')+'">'+esc(sec[1].split(" (")[0])+'</a>';
    }).join("");
  }

  function renderStrip(){
    var strip = document.getElementById("statestrip"); if(!strip) return;
    var st = stateById[state.st];
    if(!st){ strip.innerHTML = ''; strip.className = 'strip off'; return; }
    var parts = ['State '+esc(st.id)+': '+esc(st.who)+'; lands on '+esc(st.lands_on)+'; primary action: '+esc(st.primary_action)];
    if(st.minutes) parts.push(esc(st.minutes));
    if(st.exit) parts.push('exit: '+esc(st.exit));
    if(st.mock) parts.push('mock <a href="#'+esc(st.mock)+'" class="br">'+esc(st.mock)+'</a>');
    strip.innerHTML = parts.join('; ');
    strip.className = 'strip';
  }

  function renderScreen(){
    var s = SCREENS[state.idx];
    var frame = document.getElementById("frame");
    frame.className = "frame " + (s.frame === "desktop" ? "desktop" : "phone");
    var body = s.ui.map(el).join("");
    var hidden = !tierOk(s) ? '<div class="w-hidden">Not shown to a '+esc(state.tier)+' user</div>' : '';
    frame.innerHTML = '<div class="frame-top"><span>'+esc(s.id)+'</span><span>'+esc(s.title)+'</span><span>'+esc(s.template)+'</span></div><div class="frame-body">'+hidden+body+'</div>';
    document.getElementById("crumb").textContent = secName[s.sec] + "  /  " + s.id + "  " + s.title;
    var w = walkList(); var pos = w.indexOf(state.idx);
    document.getElementById("counter").textContent = (pos >= 0 ? (pos+1) + " of " + w.length : "outside the current filter") + "  /  " + SCREENS.length + " screens in v0.2";
    Array.prototype.forEach.call(frame.querySelectorAll("[data-go]"), function(b){
      b.addEventListener("click", function(ev){ ev.preventDefault(); var t = b.getAttribute("data-go"); if(t && byId[t] !== undefined){ ensureScope(byId[t]); go(byId[t]); } });
    });
    renderStrip();
  }

  function list(title, arr, linkable){
    if(!arr || !arr.length) return '';
    return '<div class="spec-block"><div class="spec-t">'+title+'</div><ul>'+arr.map(function(x){
      if(linkable){ return '<li><span>'+esc(x[0])+'</span> <a href="#'+esc(x[1])+'" class="br">'+esc(x[1])+'</a></li>'; }
      return '<li>'+esc(x)+'</li>';
    }).join("")+'</ul></div>';
  }
  function fieldLine(f){
    if(typeof f === "string") return f;
    var bits = [];
    if(f.gate) bits.push("gate");
    if(f.source) bits.push("source " + (Array.isArray(f.source) ? f.source.join(", ") : f.source));
    if(f.precision) bits.push("precision " + (Array.isArray(f.precision) ? f.precision.join(", ") : f.precision));
    return (f.f || f.name || "") + (bits.length ? " (" + bits.join("; ") + ")" : "") + (f.note ? ": " + f.note : "");
  }
  function marker(s){
    var v = s.v02 || {status:"kept", causes:[]};
    var st = v.status;
    var label = st === "new" ? "New in v0.2" : (st === "changed" || st === "rebuilt") ? "Changed in v0.2" + (st === "rebuilt" ? " (rebuilt)" : "") : "Kept from v0.1";
    var cls = st === "new" ? " new" : (st === "changed" || st === "rebuilt") ? " changed" : "";
    var causes = (SPEC === "full" && v.causes && v.causes.length) ? '<div>Cause: '+v.causes.map(esc).join("; ")+'</div>' : '';
    return '<div class="marker'+cls+'"><b>'+label+'</b>'+causes+'</div>';
  }

  function renderSpec(){
    var s = SCREENS[state.idx]; var n = noteFor(s.id);
    var c = s.compliance || {review:false, reasons:[], checks:[]};
    var html = marker(s);
    html += '<div class="spec-purpose">'+esc(s.purpose)+'</div>';
    if(SPEC === "compliance"){
      html += '<div class="spec-block"><div class="spec-t">Compliance flag</div><div class="tiers">reasons: ' + esc((c.reasons || []).join(", ")) + (c.note ? '; ' + esc(c.note) : '') + '</div></div>';
      if(c.checks && c.checks.length){
        html += '<div class="chk"><b>Compliance checklist</b><ul>'+c.checks.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div>';
      }
      html += '<div class="spec-block"><div class="spec-t">Where it sits</div><div class="tiers">'+esc(s.template)+'; path '+esc(s.path)+'; shown to '+esc(s.tier.join(", "))+'</div></div>';
      document.getElementById("spec").innerHTML = html;
      reviewControls(s, n);
      return;
    }
    html += '<div class="spec-block"><div class="spec-t">Template</div><div class="tiers">'+esc(s.template)+'</div></div>';
    html += '<div class="spec-block"><div class="spec-t">Path</div><div class="tiers">'+esc(s.path)+'</div></div>';
    html += '<div class="spec-block"><div class="spec-t">Shown to</div><div class="tiers">'+esc(s.tier.join(", "))+'</div></div>';
    html += list("Fields captured", (s.spec.fields || []).map(fieldLine));
    if(s.spec.ladder && s.spec.ladder.length){
      html += '<div class="spec-block"><div class="spec-t">Capture ladder</div><ul>'+s.spec.ladder.map(function(x){ return '<li><b>'+esc(x[0])+'</b>: '+esc(x[1])+'</li>'; }).join("")+'</ul></div>';
    }
    if(s.spec.multi_select){
      var ms = s.spec.multi_select;
      html += '<div class="spec-block"><div class="spec-t">Multi-select</div><ul>'+(ms.options || []).map(function(o){ return '<li><span>'+esc(o[0])+'</span> opens <a href="#'+esc(o[1])+'" class="br">'+esc(o[1])+'</a></li>'; }).join("")+
              '<li>'+esc(ms.none)+': every type is '+esc(ms.unticked)+'; then <a href="#'+esc(ms.after)+'" class="br">'+esc(ms.after)+'</a></li><li>Unticked types: '+esc(ms.unticked)+', never opened</li>'+(ms.prefilled ? '<li>'+esc(ms.prefilled)+'</li>' : '')+'</ul></div>';
    }
    if(s.spec.chip_map){
      html += '<div class="spec-block"><div class="spec-t">Chips and what each reopens</div><ul>'+s.spec.chip_map.map(function(c){ return '<li><span>'+esc(c.chip)+'</span>: '+c.reopens.map(function(t){ return '<a href="#'+esc(t)+'" class="br">'+esc(t)+'</a>'; }).join(", ")+'</li>'; }).join("")+'</ul></div>';
    }
    html += list("Logic", s.spec.logic);
    html += list("Branches", s.spec.branches, true);
    html += list("States", s.spec.states);
    html += list("Dev notes", s.spec.dev);
    html += list("Events", s.events);
    if(SPEC === "full"){
      html += '<div class="spec-block"><div class="spec-t">Compliance flag</div><div class="tiers">' + (c.review ? 'review: yes' : 'review: no') + '; reasons: ' + esc((c.reasons || []).join(", ")) + (c.note ? '; ' + esc(c.note) : '') + '</div></div>';
      if(c.checks && c.checks.length){
        html += '<div class="chk"><b>Compliance checklist</b><ul>'+c.checks.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div>';
      }
    }
    document.getElementById("spec").innerHTML = html;
    reviewControls(s, n);
  }
  function reviewControls(s, n){
    var v = document.getElementById("verdict");
    if(v) Array.prototype.forEach.call(v.querySelectorAll("button"), function(b){ b.className = (b.getAttribute("data-v") === n.verdict) ? "on" : ""; });
    var rs = document.getElementById("reason"); if(rs) rs.value = n.reason || "";
    var ta = document.getElementById("comment"); if(ta){ ta.value = n.text || ""; ta.placeholder = "Comment on "+s.id+": what to keep, change or drop, and why. Compliance: comment on language."; }
    var rv = document.getElementById("reviewer"); if(rv) rv.value = store.who || "";
    syncReason();
    if(BOARD) BOARD.refreshHistory();
    flash("");
  }
  function syncReason(){
    var wrap = document.getElementById("reason-wrap"); if(!wrap) return;
    wrap.className = "reason-wrap" + (store.who === "Compliance" ? "" : " off");
  }

  function go(i){
    if(i < 0 || i >= SCREENS.length) return;
    state.idx = i; var id = SCREENS[i].id;
    if(location.hash !== "#"+id){ try { history.replaceState(null, "", "#"+id); } catch(e){} }
    renderNav(); renderRibbon(); renderScreen(); renderSpec();
    var sel = document.getElementById("jump"); if(sel) sel.value = id;
    var m = document.getElementById("main"); if(m) m.scrollTop = 0;
  }
  function step(d){
    var w = walkList(); if(!w.length) return;
    var pos = w.indexOf(state.idx);
    var j = pos < 0 ? 0 : (pos + d + w.length) % w.length;
    go(w[j]);
  }
  function goFirst(){ var w = walkList(); if(w.length) go(w[0]); else { flash("No screen matches this filter"); } }

  // ---------- map ----------
  function renderMap(){
    var html = '';
    SECTIONS.forEach(function(sec){
      var items = scope().filter(function(s){ return s.sec === sec[0]; });
      if(!items.length) return;
      html += '<div class="map-sec"><h3>'+esc(sec[1])+'</h3><div class="map-row">'+items.map(function(s){
        return '<a href="#'+s.id+'" class="map-chip'+(tierOk(s) ? '' : ' dim')+'"><b>'+s.id+'</b>'+esc(s.title)+'</a>';
      }).join("")+'</div></div>';
    });
    document.getElementById("map").innerHTML = html;
  }
  function toggleMap(force){
    state.map = (force === undefined) ? !state.map : force;
    document.body.classList.toggle("map-on", state.map);
    document.getElementById("mapbtn").textContent = state.map ? "Back to screens" : "Journey map";
    if(state.map) renderMap();
  }

  // ---------- export ----------
  function exportText(){
    var lines = [EXPORT_TITLE, "Exported " + new Date().toLocaleString() + (store.who ? " by " + store.who : ""),
                 "Write-back: " + wb(), ""];
    var count = 0;
    SECTIONS.forEach(function(sec){
      var items = SCREENS.filter(function(s){ return s.sec === sec[0]; }).filter(function(s){ var n = store.notes[s.id]; return n && (n.text || n.verdict); });
      if(!items.length) return;
      lines.push("## " + sec[1]);
      items.forEach(function(s){
        var n = store.notes[s.id]; count++;
        var tag = []; if(n.verdict) tag.push(n.verdict); if(n.who) tag.push(n.who); if(n.reason) tag.push(n.reason);
        lines.push("- **" + s.id + " " + s.title + "**" + (tag.length ? " [" + tag.join("; ") + "]" : ""));
        if(n.text) lines.push("  " + String(n.text).split("\n").join("\n  "));
      });
      lines.push("");
    });
    if(!count) lines.push("(no comments yet)");
    return lines.join("\n");
  }
  function exportNotes(){
    var md = exportText();
    try { navigator.clipboard && navigator.clipboard.writeText(md); } catch(e){}
    try {
      var blob = new Blob([md], {type:"text/markdown"});
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = EXPORT_FILE;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch(e){}
    flash("Comments exported and copied.");
  }

  // ---------- filters ----------
  function setFilter(kind, value){
    if(kind === "tier"){ state.tier = TIERS.indexOf(value) >= 0 ? value : "ALL"; }
    else if(kind === "path"){ state.path = PATHS.indexOf(value) >= 0 ? value : "both"; }
    else if(kind === "comp"){ state.comp = (value === "all" || value === "flagged" || reasonNames.indexOf(value) >= 0) ? value : "all"; }
    else if(kind === "tpl"){ state.tpl = (value === "all" || templates.indexOf(value) >= 0) ? value : "all"; }
    else if(kind === "state"){
      state.st = stateById[value] ? value : "";
      var st = stateById[state.st];
      syncFilters();
      if(st && byId[st.lands_on] !== undefined){ ensureScope(byId[st.lands_on]); go(byId[st.lands_on]); }
      else { go(state.idx); }
      if(state.map) renderMap();
      return;
    }
    syncFilters();
    if(!inScope(SCREENS[state.idx]) || !tierOk(SCREENS[state.idx])) goFirst(); else go(state.idx);
    if(state.map) renderMap();
  }
  function syncFilters(){
    var tf = document.getElementById("tiers");
    if(tf) Array.prototype.forEach.call(tf.querySelectorAll("button"), function(x){ x.className = x.getAttribute("data-t") === state.tier ? "on" : ""; });
    var p = document.getElementById("fpath"); if(p) p.value = state.path;
    var c = document.getElementById("fcomp"); if(c) c.value = state.comp;
    var t = document.getElementById("ftpl"); if(t) t.value = state.tpl;
    var s = document.getElementById("fstate"); if(s) s.value = state.st;
    var sel = document.getElementById("jump");
    if(sel){ sel.innerHTML = scope().map(function(x){ return '<option value="'+x.id+'">'+x.id+'  '+esc(x.title)+'</option>'; }).join(""); sel.value = SCREENS[state.idx].id; }
  }
  function opt(v, label, on){ return '<option value="'+esc(v)+'"'+(on ? ' selected' : '')+'>'+esc(label)+'</option>'; }

  // ---------- wiring ----------
  function init(){
    var tf = document.getElementById("tiers");
    if(tf){
      tf.innerHTML = TIERS.map(function(t){ return '<button data-t="'+t+'"'+(t === state.tier ? ' class="on"' : '')+'>'+t+'</button>'; }).join("");
      tf.addEventListener("click", function(ev){ var b = ev.target.closest("button"); if(!b) return; setFilter("tier", b.getAttribute("data-t")); });
    }
    var fp = document.getElementById("fpath");
    if(fp){
      fp.innerHTML = opt("both", "both paths", true) + opt("aa", "aa", false) + opt("manual", "manual", false);
      fp.addEventListener("change", function(){ setFilter("path", fp.value); });
    }
    var fs = document.getElementById("fstate"); var fsw = document.getElementById("fstate-wrap");
    if(fs && states.length){
      fs.innerHTML = opt("", "no state", true) + states.map(function(st){ return opt(st.id, st.id + "  " + st.who, false); }).join("");
      fs.addEventListener("change", function(){ setFilter("state", fs.value); });
    } else if(fsw){ fsw.className = "off"; }
    var fc = document.getElementById("fcomp");
    if(fc){
      fc.innerHTML = opt("all", "all screens", true) + opt("flagged", "flagged only", false) + reasonNames.map(function(r){ return opt(r, r, false); }).join("");
      fc.addEventListener("change", function(){ setFilter("comp", fc.value); });
    }
    var ft = document.getElementById("ftpl");
    if(ft){
      ft.innerHTML = opt("all", "all templates", true) + templates.map(function(t){ return opt(t, t, false); }).join("");
      ft.addEventListener("change", function(){ setFilter("tpl", ft.value); });
    }

    var prev = document.getElementById("prev"); if(prev) prev.addEventListener("click", function(){ step(-1); });
    var next = document.getElementById("next"); if(next) next.addEventListener("click", function(){ step(1); });
    var mb = document.getElementById("mapbtn"); if(mb) mb.addEventListener("click", function(){ toggleMap(); });
    var ex = document.getElementById("export"); if(ex) ex.addEventListener("click", exportNotes);

    var rv = document.getElementById("reviewer");
    if(rv && LOCK){
      rv.innerHTML = opt(LOCK, LOCK, true); rv.disabled = true; store.who = LOCK; save();
    } else if(rv){
      rv.innerHTML = opt("", "reviewing as", !store.who) + IDENTITIES.map(function(n){ return opt(n, n, store.who === n); }).join("");
      rv.addEventListener("change", function(){ store.who = IDENTITIES.indexOf(rv.value) >= 0 ? rv.value : ""; save(); syncReason(); flash(store.who ? "Reviewing as " + store.who : ""); });
    }
    var rs = document.getElementById("reason");
    if(rs){
      rs.innerHTML = opt("", "reason category", true) + reasonNames.map(function(r){ return opt(r, r, false); }).join("");
      rs.addEventListener("change", function(){ var n = noteFor(SCREENS[state.idx].id); n.reason = reasonNames.indexOf(rs.value) >= 0 ? rs.value : ""; n.who = store.who; save(); put(SCREENS[state.idx].id, "reason", n.reason, "field_edit"); flash("Saved in this browser"); });
    }

    var v = document.getElementById("verdict");
    if(v){
      v.innerHTML = VERDICTS.map(function(x){ return '<button data-v="'+x+'">'+x+'</button>'; }).join("");
      v.addEventListener("click", function(ev){ var b = ev.target.closest("button"); if(!b) return;
        var id = SCREENS[state.idx].id; var n = noteFor(id); n.verdict = (n.verdict === b.getAttribute("data-v")) ? "" : b.getAttribute("data-v"); n.who = store.who; save(); put(id, "verdict", n.verdict, "verdict"); renderSpec(); renderNav(); flash("Saved in this browser"); });
    }
    var ta = document.getElementById("comment"); var timer;
    if(ta) ta.addEventListener("input", function(){ var id = SCREENS[state.idx].id; var n = noteFor(id); n.text = ta.value; n.who = store.who; save();
      flash("Saving..."); clearTimeout(timer); timer = setTimeout(function(){ put(id, "text", noteFor(id).text || "", "comment"); flash("Saved in this browser"); renderNav(); }, 1500); });
    if(BOARD){ BOARD.attach(ta, function(){ return SCREENS[state.idx].id; }); BOARD.init({page: PAGE, apply: applyRemote}); }

    var sel = document.getElementById("jump");
    if(sel) sel.addEventListener("change", function(){ if(byId[sel.value] !== undefined) go(byId[sel.value]); });
    window.addEventListener("hashchange", function(){ var id = location.hash.replace("#", ""); if(byId[id] !== undefined){ if(state.map) toggleMap(false); ensureScope(byId[id]); go(byId[id]); } else if(dropped.indexOf(id) >= 0){ flash(id + " was dropped in v0.2; see the Changelog tab"); } else if(split.indexOf(id) >= 0){ flash(id + " was split into its instances in v0.2; see the Changelog tab"); } });
    document.addEventListener("keydown", function(ev){ if(ev.target.tagName === "TEXTAREA" || ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return; if(ev.key === "ArrowRight") step(1); if(ev.key === "ArrowLeft") step(-1); });
    syncFilters();
    var start = location.hash.replace("#", "");
    if(byId[start] !== undefined){ ensureScope(byId[start]); go(byId[start]); }
    else { go(0); if(dropped.indexOf(start) >= 0) flash(start + " was dropped in v0.2; see the Changelog tab"); else if(split.indexOf(start) >= 0) flash(start + " was split into its instances in v0.2; see the Changelog tab"); }
  }
  document.addEventListener("DOMContentLoaded", init);

  // test hook for scripts/check_site.py (and for the console)
  window.yeslyfWire = {
    go: function(id){ if(byId[id] !== undefined){ ensureScope(byId[id]); go(byId[id]); } },
    step: step,
    setFilter: setFilter,
    walk: function(){ return walkList().map(function(i){ return SCREENS[i].id; }); },
    current: function(){ return SCREENS[state.idx].id; },
    exportText: exportText,
    filters: function(){ return {tiers:TIERS, paths:PATHS, comps:COMP_FILTER ? ["all","flagged"].concat(reasonNames) : [], templates:templates, states:states.map(function(st){ return st.id; })}; },
    landing: function(id){ return stateById[id] ? stateById[id].lands_on : ""; }
  };
})();
</script>
